# Postgres + Redis local cho dev, dữ liệu clone từ prod bằng clone-prod-db.sh.
# Cổng 5433/6380 để không đụng Postgres/Redis khác trên máy (5432/6379). Chỉ nghe trên loopback.
name: qlsx-local

services:
  postgres:
    container_name: qlsx-local-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: qlsx
      POSTGRES_PASSWORD: qlsx
      POSTGRES_DB: qlsx
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Postgres 18 giữ dữ liệu ở /var/lib/postgresql/18/docker nên mount thư mục cha.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlsx -d qlsx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: qlsx-local-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
