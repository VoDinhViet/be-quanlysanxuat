services:
  app:
    # Tên cố định để `docker ps` dễ đọc; phiên bản nằm ở tag của image (v<số>), xem `docker ps`.
    container_name: qlsx-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-quanlysanxuat-be:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "8003"
      # Ghi đè DATABASE_URL/REDIS_URL của .env.production: app nối vào Postgres/Redis cùng compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-qlsx}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@postgres:5432/${POSTGRES_DB:-qlsx}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Chỉ nghe trên loopback: Caddy (deploy/proxy) cấp HTTPS và chuyển tiếp vào 127.0.0.1:8003, không mở
    # thẳng cổng này ra internet.
    ports:
      - "127.0.0.1:${HOST_PORT:-8003}:8003"
    volumes:
      # Bind mount ra thư mục cố định trên VPS (ngoài repo) để dễ backup. Thư mục phải cho user `node`
      # (uid 1000) trong container ghi được: sudo chown -R 1000:1000 <thư mục>.
      # UPLOADS_DIR đọc từ shell hoặc file `.env` cạnh compose, KHÔNG phải .env.production (khác UPLOAD_DIR
      # — đường dẫn trong container).
      - ${UPLOADS_DIR:-/var/lib/quanlysanxuat/uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      # Trong start_period kiểm tra mỗi 3 giây để `up --wait` xong ngay khi app sẵn sàng, không chờ 30 giây.
      start_interval: 3s
      retries: 3

  postgres:
    container_name: qlsx-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qlsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-qlsx}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Từ Postgres 18, image giữ dữ liệu ở /var/lib/postgresql/18/docker nên phải mount thư mục cha
      # /var/lib/postgresql (không phải .../data như bản ≤17), để sau này pg_upgrade --link dùng được.
      - ${PGDATA_DIR:-/var/lib/quanlysanxuat/postgres}:/var/lib/postgresql
    # Chỉ mở trên loopback của host: CI mở SSH tunnel tới đây để chạy migration, không lộ ra internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  redis:
    container_name: qlsx-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_DIR:-/var/lib/quanlysanxuat/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
