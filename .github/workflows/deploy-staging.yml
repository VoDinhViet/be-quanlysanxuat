name: Deploy staging

# Push lên develop → (tsc + eslint) song song với (build image đẩy lên GHCR) → migrate DB staging → deploy lên
# môi trường test trên VPS (/opt/qlsx-staging). Hoàn toàn tách khỏi prod: image tag `staging-v<số>` (không đụng
# `latest`), environment `staging`, concurrency riêng, DB và container riêng. Không dùng pull_request_target:
# repo public, secret không được phép lộ ra fork.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      - 'deploy/backup.sh'
      - 'deploy/notify-zalo.sh'
      - 'deploy/restore.sh'
      - 'deploy/proxy/**'
      - 'deploy/monitor/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Nhánh hoặc commit cần deploy lên staging
        default: develop
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck và lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc và eslint (song song)
        run: |
          npx tsc --noEmit &
          tsc_pid=$!
          pnpm exec eslint "{src,test}/**/*.ts" &
          eslint_pid=$!
          status=0
          wait "$tsc_pid" || status=1
          wait "$eslint_pid" || status=1
          exit "$status"

  build:
    name: Build và push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: name
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=staging-v${GITHUB_RUN_NUMBER}"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Không đẩy tag `latest`: tag đó là của prod.
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.image }}:staging-sha-${{ steps.name.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Migrate và deploy lên staging
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Chuẩn bị SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 120
          EOF
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Copy compose và script lên VPS
        run: |
          ssh vps 'mkdir -p /opt/qlsx-staging'
          scp deploy/staging/docker-compose.yml deploy/staging/remote-deploy.sh deploy/staging/refresh-from-prod.sh vps:/opt/qlsx-staging/

      - name: Bật Postgres và Redis staging
        run: ssh vps 'bash /opt/qlsx-staging/remote-deploy.sh infra'

      # Postgres staging chỉ nghe trên loopback của VPS nên runner đi qua SSH tunnel. Thông tin đăng nhập lấy thẳng từ
      # container staging (không phải prod).
      - name: Migrate DB staging
        run: |
          mapfile -t db < <(ssh vps \
            'cd /opt/qlsx-staging && docker compose exec -T postgres sh -c '\''printf "%s\n%s\n%s\n" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB"'\'' && docker compose port postgres 5432 | sed "s/.*://"')
          echo "::add-mask::${db[1]}"
          ssh -o ControlMaster=no -o ControlPath=none -o ExitOnForwardFailure=yes \
            -f -N -L "15442:127.0.0.1:${db[3]}" vps
          DATABASE_URL="postgresql://${db[0]}:${db[1]}@127.0.0.1:15442/${db[2]}" pnpm db:migrate
        env:
          NODE_ENV: production

      - name: Deploy
        run: |
          printf '%s' "$GITHUB_TOKEN" | ssh vps \
            "GHCR_USER='${GITHUB_ACTOR}' bash /opt/qlsx-staging/remote-deploy.sh app '${IMAGE}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kiểm tra app trên VPS
        run: ssh vps 'curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8013/health > /dev/null && echo "staging trả lời ở 127.0.0.1:8013"'

      - name: Kiểm tra địa chỉ HTTPS công khai
        if: ${{ vars.STAGING_API_DOMAIN != '' }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "https://${API_DOMAIN}/health"
        env:
          API_DOMAIN: ${{ vars.STAGING_API_DOMAIN }}

      - name: Tóm tắt
        run: |
          {
            echo "### Đã deploy staging \`${VERSION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\` ($(git log -1 --format=%s))"
          } >> "$GITHUB_STEP_SUMMARY"
