name: Deploy

# Push lên main → (kiểm tra tsc + eslint) song song với (build image đẩy lên GHCR) → migrate DB prod → deploy lên VPS.
# Deploy chỉ chạy khi cả hai job đầu thành công. Không dùng pull_request_target: repo public, secret
# không được phép lộ ra fork.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      # Không do CI copy lên VPS, đổi nó không cần build hay deploy.
      - 'deploy/backup.sh'
  workflow_dispatch:

# Các lần deploy xếp hàng, không chạy chồng lên nhau và không bị huỷ giữa chừng.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck và lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc và eslint không phụ thuộc nhau nên chạy đồng thời; step lỗi nếu một trong hai lỗi.
      - name: tsc và eslint (song song)
        run: |
          npx tsc --noEmit &
          tsc_pid=$!
          pnpm exec eslint "{src,test}/**/*.ts" &
          eslint_pid=$!
          status=0
          wait "$tsc_pid" || status=1
          wait "$eslint_pid" || status=1
          exit "$status"

  # Chạy song song với verify. Image đẩy lên GHCR không có nghĩa là được deploy: job deploy cần cả hai job.
  build:
    name: Build và push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # GHCR yêu cầu tên repository viết thường, còn owner của repo là `VoDinhViet`.
      # Phiên bản là `v<số lần chạy>`: số tăng dần nên nhìn là biết bản nào mới hơn; commit đi kèm ở tag
      # `sha-<7 ký tự>` và label `org.opencontainers.image.revision`.
      - id: name
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=v${GITHUB_RUN_NUMBER}"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short_sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Dockerfile tách layer lớn (Chromium, node_modules) khỏi layer hay đổi (dist) nên cache GHA
          # giúp lần build thường chỉ chạy lại `nest build`.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Migrate và deploy lên VPS
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Một alias `vps` dùng chung một kết nối SSH (ControlMaster) cho scp và các lệnh ssh, đỡ bắt tay lại mỗi lần.
      - name: Chuẩn bị SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 120
          EOF
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Copy compose và script lên VPS
        run: scp docker-compose.yml deploy/remote-deploy.sh vps:/opt/quanlysanxuat/

      # Bật Postgres + Redis và dừng nếu DB chưa có schema (xem comment trong remote-deploy.sh).
      - name: Bật Postgres và Redis
        run: ssh vps 'bash /opt/quanlysanxuat/remote-deploy.sh infra'

      # Postgres chỉ lắng nghe trên loopback của VPS nên runner đi qua SSH tunnel. Thông tin đăng nhập
      # lấy thẳng từ container Postgres trên VPS (một nguồn duy nhất, không lưu thành secret thứ hai).
      # Migrate trước khi deploy: lỗi thì dừng ở đây, app cũ vẫn chạy. Vì app cũ có thể phải chạy tiếp
      # trên schema mới (khi rollback), migration cần giữ tương thích ngược (chỉ thêm, không xoá/đổi tên).
      - name: Migrate DB prod
        run: |
          mapfile -t db < <(ssh vps \
            'cd /opt/quanlysanxuat && docker compose exec -T postgres sh -c '\''printf "%s\n%s\n%s\n" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB"'\'' && docker compose port postgres 5432 | sed "s/.*://"')
          echo "::add-mask::${db[1]}"
          # Tunnel là một kết nối riêng (không dùng chung master) để nó sống suốt lúc migrate.
          ssh -o ControlMaster=no -o ControlPath=none -o ExitOnForwardFailure=yes \
            -f -N -L "15432:127.0.0.1:${db[3]}" vps
          DATABASE_URL="postgresql://${db[0]}:${db[1]}@127.0.0.1:15432/${db[2]}" pnpm db:migrate
        env:
          NODE_ENV: production

      # Token GHCR đi qua stdin, không nằm trên dòng lệnh. Script tự rollback nếu bản mới không healthy.
      - name: Deploy
        run: |
          printf '%s' "$GITHUB_TOKEN" | ssh vps \
            "GHCR_USER='${GITHUB_ACTOR}' bash /opt/quanlysanxuat/remote-deploy.sh app '${IMAGE}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kiểm tra từ bên ngoài
        run: curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "http://${VPS_HOST}:8003/health"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      # Hiện bản vừa deploy ngay trên trang kết quả của lần chạy.
      - name: Tóm tắt
        run: |
          {
            echo "### Đã deploy \`${VERSION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\` ($(git log -1 --format=%s))"
          } >> "$GITHUB_STEP_SUMMARY"
